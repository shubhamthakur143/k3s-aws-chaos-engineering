apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: batch1-webhook-alerts
  namespace: chaos-lab
spec:
  route:
    receiver: chaos-webhook
    groupBy:
      - alertname
      - chaos_name
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 5m

  receivers:
    - name: chaos-webhook
      webhookConfigs:
        - sendResolved: true
          url: http://discord-relay.monitoring.svc.cluster.local:8080/alert
