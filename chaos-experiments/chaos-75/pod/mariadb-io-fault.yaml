apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: mariadb-io-fault
  namespace: chaos-lab
spec:
  action: fault
  mode: one
  duration: "60s"
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: mariadb
  volumePath: /var/lib/mysql
  path: /var/lib/mysql/**/*
  errno: 5
  percent: 50
