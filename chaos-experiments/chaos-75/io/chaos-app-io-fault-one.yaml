apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: chaos-app-io-fault-one
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-io-fault-one
spec:
  action: fault
  mode: one
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  volumePath: /data
  path: /data/**
  percent: 50
  errno: 5
  duration: "60s"
