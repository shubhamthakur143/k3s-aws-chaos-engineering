  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-time-offset-forward-one
spec:
  mode: one
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  timeOffset: "60s"
  duration: "60s"
