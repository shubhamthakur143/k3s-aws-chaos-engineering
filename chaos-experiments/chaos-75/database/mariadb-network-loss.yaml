apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: mariadb-network-loss
  namespace: chaos-lab
  labels:
    chaos_name: mariadb-network-loss
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: mariadb
  loss:
    loss: "30"
  duration: "60s"
