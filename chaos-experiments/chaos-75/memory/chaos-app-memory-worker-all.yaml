apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: chaos-app-memory-workers-all
  namespace: chaos-lab
spec:
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  stressors:
    memory:
      workers: 3
      size: "128MB"
  duration: "60s"
