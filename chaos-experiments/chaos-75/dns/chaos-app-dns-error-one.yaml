apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: chaos-app-dns-error-one
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-dns-error-one
spec:
  action: error
  mode: one
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  patterns:
    - "*"
  duration: "60s"
