apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: mariadb-pod-failure-one
  namespace: chaos-lab
  labels:
    chaos_name: mariadb-pod-failure-one
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: mariadb
  duration: "60s"

