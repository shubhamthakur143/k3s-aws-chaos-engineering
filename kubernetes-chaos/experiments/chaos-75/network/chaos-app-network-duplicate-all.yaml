apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-app-network-duplicate-all
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-network-duplicate-all
spec:
  action: duplicate
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  duplicate:
    duplicate: "25"
  duration: "60s"
