apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-app-network-delay-all
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-network-delay-all
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  delay:
    latency: "100ms"
  duration: "60s"
