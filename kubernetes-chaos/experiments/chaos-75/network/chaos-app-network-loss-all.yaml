apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-app-network-loss-all
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-network-loss-all
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  loss:
    loss: "25"
  duration: "60s"
