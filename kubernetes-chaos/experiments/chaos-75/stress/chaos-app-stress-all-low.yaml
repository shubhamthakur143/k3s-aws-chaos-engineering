apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: chaos-app-stress-all-low
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-stress-all-low
spec:
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  stressors:
    cpu:
      workers: 1
      load: 30
    memory:
      workers: 1
      size: "64MB"
  duration: "60s"
