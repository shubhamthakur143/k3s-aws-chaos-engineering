apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: chaos-app-container-kill-all
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-container-kill-all
spec:
  action: container-kill
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
  containerNames:
    - nginx
