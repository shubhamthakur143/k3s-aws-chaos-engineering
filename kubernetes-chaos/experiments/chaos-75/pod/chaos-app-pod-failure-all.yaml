apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: chaos-app-pod-failure-all
  namespace: chaos-lab
  labels:
    chaos_name: chaos-app-pod-failure-all
spec:
  action: pod-failure
  mode: all
  duration: "30s"
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app
