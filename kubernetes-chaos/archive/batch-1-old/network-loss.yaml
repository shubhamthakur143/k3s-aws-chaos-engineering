apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-app-network-loss
  namespace: chaos-lab
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      app: chaos-app

  loss:
    loss: "50"
    correlation: "0"

  duration: "30s"
